[project]
name = "sidekick"
version = "0.1.0"
description = "A small tool-using LLM agent with a self-critiquing evaluator loop."
readme = "README.md"
authors = [
    { name = "Saifihassan", email = "saifihassan656@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "requests>=2.31.0",
    "langchain-mcp-adapters>=0.3.2",
]

[project.scripts]
sidekick = "sidekick:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
